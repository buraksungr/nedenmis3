name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      require_live:
        description: 'Require live OpenRouter or explicitly configured free Gemini text (no QA replay)'
        type: boolean
        default: false
  pull_request:
  push:
    branches: ['arena/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'resources/NOTICE.txt'
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22.22', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - name: Verify scene persistence, actual SVG retry timers and regressions
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -Variable npmOutput
          if ($LASTEXITCODE -ne 0) {
            $npmOutput | Out-File -FilePath out/render-control/npm-test-output.txt -Encoding utf8
            Write-Output "=== NPM TEST OUTPUT ==="
            $npmOutput | Select-Object -Last 200
            Write-Output "=== END ==="
            exit $LASTEXITCODE
          }
          $clock = Get-Content -Raw out/render-control/planner-clock.json | ConvertFrom-Json
          Write-Output "::notice title=SVG planner timing::Actual elapsed ms (scene gap, retry 1, 2, 3): $($clock.observedMs -join ' / '). Two scenes saved; fixture responses, production timers."
        env: { QA_PLANNER_REAL_CLOCK: '1' }
      - name: Upload npm test output on failure
        if: always()
        shell: pwsh
        run: |
          if (Test-Path out/render-control/npm-test-output.txt) {
            $content = Get-Content -Raw out/render-control/npm-test-output.txt
            Write-Output "=== CAPTURED NPM TEST OUTPUT ==="
            Write-Output $content
            Write-Output "=== END CAPTURED OUTPUT ==="
          }
      - run: npm run build
      - name: Verify release notes are generated only from installed installer facts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/installer | Out-Null
          $version = node -p "require('./package.json').version"
          Set-Content -LiteralPath "dist/installer/Nedenmis-Studio-$version-Setup.exe" -Value 'release-notes-contract-check' -NoNewline
          $hash = (Get-FileHash -LiteralPath "dist/installer/Nedenmis-Studio-$version-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath out/render-control/install-report.json -Value '{"installed":true}'
          Set-Content -LiteralPath out/render-control/planner-clock.json -Value '{"observedMs":[5000,10000,20000,35000]}'
          $env:EXPECTED_SHA256 = $hash
          node scripts/release-notes.mjs
          if (-not (Select-String -LiteralPath out/render-control/release-notes.md -Pattern $hash -Quiet)) { throw 'Release notes omit the verified installer digest' }
          $env:EXPECTED_SHA256 = '0' * 64
          node scripts/release-notes.mjs
          if ($LASTEXITCODE -eq 0) { throw 'Release notes accepted a wrong installer digest' }
          $env:EXPECTED_SHA256 = ''
          Remove-Item -LiteralPath "dist/installer/Nedenmis-Studio-$version-Setup.exe"
          Set-Content -LiteralPath out/render-control/install-report.json -Value '{"installed":false}'
          node scripts/release-notes.mjs
          if ($LASTEXITCODE -eq 0) { throw 'Release notes accepted an unverified install report' }
          Remove-Item -LiteralPath out/render-control/release-notes.md
          exit 0
      - name: Verify legacy atlas playback, mixed storyboard, static photo fades and single-layer captions
        run: npm run test:render
        timeout-minutes: 12
      - name: Stop a real in-flight render, release child processes and finish from the saved scene
        run: npm run test:stop
        timeout-minutes: 12
      - name: Test storyboard editing, voice preflight and one-click production in Edge
        run: npm run test:ui
        timeout-minutes: 15
      - name: Publish only when this version has no release yet
        shell: pwsh
        run: |
          $tag = 'v' + (node -p "require('./package.json').version")
          # A missing tag makes the API return 404; treat exactly that as "free". An already
          # published version is not rebuilt or overwritten: bump package.json for a release.
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>$null
          $found = $LASTEXITCODE -eq 0
          $publish = if (!$found) { 'true' } else { 'false' }
          if ($found) {
            $release = $existing | ConvertFrom-Json
            if (!$release.draft) {
              Write-Output "::notice title=Release skipped::$tag is already published; this build still uploads its installer artifact."
            } else {
              gh release delete $tag --yes
              if ($LASTEXITCODE -ne 0) { throw "Could not remove stale draft $tag" }
              $publish = 'true'
            }
          }
          "PUBLISH_RELEASE=$publish" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          exit 0
        env: { GH_TOKEN: '${{ github.token }}' }
      - name: Package Windows installer
        run: npx --no-install electron-builder --win nsis --x64 --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Install and launch the packaged desktop app
        shell: pwsh
        run: ./scripts/verify-windows-install.ps1
      - name: Prepare release from the verified installer
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/arena/bf4f6387-nedenmis3' && env.PUBLISH_RELEASE == 'true' }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exe = "dist/installer/Nedenmis-Studio-$version-Setup.exe"
          $env:EXPECTED_SHA256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          node scripts/release-notes.mjs
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish GitHub release with the installer (GitHub sends the release e-mail)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/arena/bf4f6387-nedenmis3' && env.PUBLISH_RELEASE == 'true' }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $title = "Nedenmiş Studio $version · sabit kamera · SVG sahne temizleme"
          gh release create $env:RELEASE_TAG "dist/installer/Nedenmis-Studio-$version-Setup.exe" --target $env:GITHUB_SHA --title $title --notes-file out/render-control/release-notes.md --latest
        env: { GH_TOKEN: '${{ github.token }}' }
      - name: Record the published release in the job summary
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/arena/bf4f6387-nedenmis3' && env.PUBLISH_RELEASE == 'true' }}
        shell: pwsh
        run: |
          $url = gh release view $env:RELEASE_TAG --json url --jq .url
          "## Windows kurucusu yayınlandı`n`n$url" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        env: { GH_TOKEN: '${{ github.token }}' }
      - uses: actions/upload-artifact@v4
        with:
          name: Nedenmis-Studio-Windows-x64
          path: dist/installer/*Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Local-render-QA-not-Gemini-acceptance
          path: |
            out/render-control/local-render-control.mp4
            out/render-control/probe.json
            out/render-control/svg-atlas-control.mp4
            out/render-control/svg-atlas-report.json
            out/render-control/caption-plate-report.json
            out/render-control/static-fade-report.json
            out/render-control/install-report.json
            out/render-control/planner-clock.json
            out/render-control/cancellation.json
            out/render-control/fallback-control.*
            out/render-control/fallback-diagnostics.ndjson
            out/render-control/release-notes.md

  acoustic-control:
    name: Real Turkish CPU alignment
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22.22', cache: npm }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11', cache: pip, cache-dependency-path: python/requirements.txt }
      - run: npm ci
      - run: npm run build
      - name: Install CPU dependencies, align real speech and render from the measured timestamps
        run: npm run test:render -- --whisper --setup-python
      - name: Prepare Turkish QA narration (not included in the installer)
        run: |
          python -m pip install sherpa-onnx==1.12.29
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/prepare-qa-speech.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/prepare-qa-speech.py --flight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/prepare-qa-speech.py --whale
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/prepare-qa-speech.py --ant
      - name: Verify motion SVG in the encoded ant film (stationary landmarks, independent actors, CPU Whisper)
        run: npm run test:ant
      - uses: actions/upload-artifact@v4
        with:
          name: Karincalar-Kisin-Nereye-Gider-Sabit-Kamera-SVG-MP4
          if-no-files-found: error
          path: |
            out/ant-motion-control/karincalar-kisin-nereye-gider.*
            out/ant-motion-control/frames/
            out/ant-motion-control/drawings/
            out/ant-motion-control/report.json
      - name: Optional live subject and object planning (requires an authorized text account)
        if: ${{ inputs.require_live }}
        env:
          QA_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QA_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          QA_GEMINI_TEXT_MODEL: ${{ vars.QA_FREE_GEMINI_TEXT_MODEL }}
        run: npx --no-install tsx tests/live-object-board.ts
      - name: Reopen archived layered whale film, verify stationary artwork and CPU Whisper
        run: npm run test:whale
      - uses: actions/upload-artifact@v4
        with:
          name: Karaya-Vuran-Balinalar-Tam-Ekran-Vektor-Whisper-MP4
          if-no-files-found: error
          path: |
            out/whale-control/karaya-vuran-balinalar.*
            out/whale-control/frames/
            out/whale-control/report.json
            out/whale-control/layers.json
            out/whale-control/drawings/
      - name: One-click thirst documentary with actual CPU word alignment
        run: npm run test:thirst
      - name: Play back a saved twelve-scene flight atlas with CPU Whisper
        run: npm run test:flight
      - uses: actions/upload-artifact@v4
        with:
          name: Ucus-ve-Irtifa-12-Sablon-Whisper-MP4
          if-no-files-found: error
          path: |
            out/flight-control/ucuslar-ve-irtifa.*
            out/flight-control/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: Tatli-ve-Susama-Whisper-MP4
          if-no-files-found: error
          path: |
            out/thirst-control/tatli-ve-susama.*
            out/thirst-control/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: Turkish-CPU-alignment-QA
          path: |
            out/acoustic-control/alignment-report.json
            out/acoustic-control/local-render-control.mp4
            out/acoustic-control/probe.json
