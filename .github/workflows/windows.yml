name: Windows desktop installer
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['arena/**']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22.22', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate the Windows production renderer
        run: npm run test:render
      - run: npm run test:ui
      - name: Package Windows installer
        run: npx --no-install electron-builder --win nsis --x64 --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Install and launch the packaged desktop app
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = (Get-Item "dist/installer/Nedenmis-Studio-$version-Setup.exe").FullName
          $target = "$env:RUNNER_TEMP\Nedenmiş Studio Test"
          $install = Start-Process $installer -ArgumentList "/S /D=$target" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "NSIS install: $($install.ExitCode)" }
          # A real exe that exits before a DevTools handshake. The installed app must fall
          # back to real Edge/Chrome and load the packaged composition outside the checkout.
          $env:STUDIO_BROWSER = "$env:SystemRoot\System32\where.exe"
          $process = Start-Process "$target\Nedenmiş Studio.exe" -WorkingDirectory $env:RUNNER_TEMP -ArgumentList '--verify-install' -PassThru
          if (!$process.WaitForExit(120000)) { $process.Kill(); throw 'Installed app timed out' }
          $report = Get-Content "$env:TEMP\Nedenmis-install-report.json" -Raw
          Write-Output $report
          if ($process.ExitCode -ne 0) { Write-Output "::error title=Native install::$report" }
          if ($process.ExitCode -ne 0) { throw "Installed app: $($process.ExitCode)" }
          $remotion = ($report | ConvertFrom-Json).checks | Where-Object id -eq 'remotion'
          if (!$remotion.ok -or $remotion.detail -notmatch '(msedge|chrome|chromium)\.exe$') { throw "System browser fallback: $report" }
          Copy-Item "$env:TEMP\Nedenmis-install-report.json" out/render-control/install-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: Nedenmis-Studio-Windows-x64
          path: dist/installer/*Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Local-render-QA-not-Gemini-acceptance
          path: |
            out/render-control/local-render-control.mp4
            out/render-control/probe.json
            out/render-control/install-report.json

  acoustic-control:
    name: Real Turkish CPU alignment
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22.22', cache: npm }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11', cache: pip, cache-dependency-path: python/requirements.txt }
      - run: npm ci
      - run: npm run build
      - name: Install CPU dependencies, align real speech and render from the measured timestamps
        run: npm run test:render -- --whisper --setup-python
      - uses: actions/upload-artifact@v4
        with:
          name: Turkish-CPU-alignment-QA
          path: |
            out/acoustic-control/alignment-report.json
            out/acoustic-control/local-render-control.mp4
            out/acoustic-control/probe.json
